<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Name</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(100deg, #ffe478, #896e26);
      color: rgb(0, 0, 0);
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }

    p {
      margin: 0 0 24px;
      color: #000000;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .links a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      color: white;
      background: #1e293b;
      padding: 14px 16px;
      border-radius: 12px;
      font-weight: 600;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .links a:hover {
      background: #334155;
      transform: translateY(-1px);
    }

    .links a.primary {
      background: #0f766e;
    }

    .links a.primary:hover {
      background: #0d9488;
    }

    .icon {
      width: 20px;
      font-size: 18px;
      line-height: 1;
      text-align: center;
      flex: 0 0 auto;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Lauro Romeo Maurer</h1>
    <p>Nice to meet you.</p>

    <div class="links">
      <a id="vcard-link" class="primary" href="#" download="Lauro Maurer.vcf" aria-label="Save contact card">
        <i class="fa-solid fa-address-card icon" aria-hidden="true"></i>
        Save Contact
      </a>
      <a href="https://www.linkedin.com/in/lauro-maurer-9214b03a0/" target="_blank" aria-label="Open LinkedIn profile">
        <i class="fa-brands fa-linkedin icon" aria-hidden="true"></i>
        LinkedIn
      </a>
      <a href="https://github.com/lauromaurer" target="_blank" aria-label="Open GitHub profile">
        <i class="fa-brands fa-github icon" aria-hidden="true"></i>
        GitHub
      </a>
      <a href="mailto:lauro.maurer@icloud.com" aria-label="Send email">
        <i class="fa-solid fa-envelope icon" aria-hidden="true"></i>
        Email
      </a>
    </div>
  </main>

  <script>
    const contact = {
      firstName: "Lauro",
      lastName: "Maurer",
      fullName: "Lauro Maurer",
      title: "",
      organization: "",
      phone: "+41 75 417 64 65",
      email: "lauro.maurer@icloud.com",
      website: "https://example.com",
      linkedin: "https://www.linkedin.com/in/lauro-maurer-9214b03a0/",
      github: "https://github.com/lauromaurer"
    };

    const vCard = [
      "BEGIN:VCARD",
      "VERSION:3.0",
      `N:${contact.lastName};${contact.firstName};;;`,
      `FN:${contact.fullName}`,
      contact.organization && `ORG:${contact.organization}`,
      contact.title && `TITLE:${contact.title}`,
      contact.phone && `TEL;TYPE=CELL:${contact.phone}`,
      contact.email && `EMAIL:${contact.email}`,
      contact.website && `URL:${contact.website}`,
      contact.linkedin && `X-SOCIALPROFILE;TYPE=linkedin:${contact.linkedin}`,
      contact.github && `X-SOCIALPROFILE;TYPE=github:${contact.github}`,
      "END:VCARD"
    ].filter(Boolean).join("\r\n");

    const blob = new Blob([vCard], { type: "text/vcard;charset=utf-8" });
    document.getElementById("vcard-link").href = URL.createObjectURL(blob);
  </script>
</body>
</html>
